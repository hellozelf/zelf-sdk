[project]
# Published as `zelf-sdk`; imports as `zelf`.
name = "zelf-sdk"
version = "1.3.1"
description = "Python client for the Zelf APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Zelf" }]
keywords = ["zelf", "api", "sdk", "social", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28", "pydantic>=2.9", "anyio>=4.0"]

[project.urls]
Homepage = "https://github.com/hellozelf/zelf-sdk"
Source = "https://github.com/hellozelf/zelf-sdk"
Issues = "https://github.com/hellozelf/zelf-sdk/issues"
Changelog = "https://github.com/hellozelf/zelf-sdk/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zelf"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    # Pinned to a minor: the codegen job fails if `ruff format` moves a byte.
    "ruff==0.14.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP007", "UP045"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["zelf"]

[tool.coverage.report]
fail_under = 100
show_missing = true

  /api/v1/content/:
    get:
      operationId: content.list
      description: |-
        `content.list`

        Returns a paginated list of content. Every request must scope what it covers: supply at least one of `creator_id`, `creator_username`, `search`, `brand_id`, or `external_id`, otherwise the request is rejected with `VALIDATION_ERROR`. By default results are ordered by `posted_at` descending (most recently posted first); override with `order_by`.

        Every response echoes the effective defaults in `applied_filters` (the resolved date window, `page`, `page_size`, and `brand_id`), so an empty `results` set can be explained.

        ### Dates

        Every request covers a time window. Four parameters define it.

        | Parameter | Type | Defines |
        |---|---|---|
        | `posted_after` | timestamp | Start of the window |
        | `posted_within_hours` | integer, 1 to 8760 | Start of the window, counted back from the current time |
        | `posted_within_days` | integer, 1 to 365 | Start of the window, counted back from the current time |
        | `posted_before` | timestamp | End of the window |

        A request with no date parameter covers the last 7 days. `applied_filters` reports this as `posted_within_days: 7`.

        Three parameters define the start of the window, so a request may carry more than one. Such a request is valid. The API applies the first parameter present in this order and ignores the rest:

        1. `posted_after`
        2. `posted_within_hours`
        3. `posted_within_days`

        `applied_filters` contains only the parameter that was applied, so it identifies the window that produced a response.

        `posted_before` defines the end of the window and combines with any of the three. On its own it covers the 366 days before it. With `posted_within_hours` or `posted_within_days` the window is counted back from `posted_before` instead of from the current time, so `posted_before=2026-09-01T00:00:00Z` with `posted_within_hours=24` covers `2026-08-31T00:00:00Z` to `2026-09-01T00:00:00Z`.

        Two limits apply to every window. `posted_after` and `posted_before` may be at most 366 days apart, and a longer period is read as consecutive requests. Content posted before 2025-01-01 is not available.

        A value outside the ranges in the table returns `VALIDATION_ERROR`. Such values are rejected, not clamped: `posted_within_days=400` is an error rather than 365.

        Results are paginated: `page` defaults to `1` and `page_size` to `30`, which is also the maximum (larger values are reduced to `30`). `item_count` is the number of rows in the returned page, not the size of the whole match set, and `next` is non-null while further pages remain. For the total number of matching posts, call `content.statistics` with the same query and read `post_count`.

        When `brand_id` is omitted, the brand-specific fields (`brand_id`, `is_owned`, `is_tagged`, `is_influencer`, `mention_type`, `net_promoter_score`) are returned as `null`, and the brand-only filters and sorts return `BRAND_ID_REQUIRED`. Supply `brand_id` (one or more values, comma-separated) to populate those fields and enable the brand-only filters. Each row's `id` is the value to use for `content.details` and for the `comments.list` `content_id`.

        **Examples**

        - Full-text search over the last 7 days (brand fields null): `GET /api/v1/content/?search=running+shoes`
        - Brand content over an explicit window: `GET /api/v1/content/?brand_id=brd_123&posted_after=2026-01-01T00:00:00Z&posted_before=2026-06-30T23:59:59Z`
        - Most-viewed first: add `&order_by=view_count`. Sort direction is inverted, so a bare key sorts descending and a `-` prefix ascending.
      summary: List Content
      parameters:
      - in: query
        name: brand_id
        schema:
          type: string
        description: One or more brand ids, comma-separated, as returned by `brands.list`.
          Scopes the query to those brands, populates the brand-specific fields, and
          enables the brand-only filters and sorts. Any id you cannot access returns
          `403`, and a malformed value returns `INVALID_ID`.
      - name: comment_count
        in: query
        required: false
        schema:
          type: integer
        description: Number of comments on the post.
      - name: comment_count_max
        in: query
        required: false
        schema:
          type: integer
        description: Number of comments on the post. (Inclusive Upper Bound)
      - name: comment_count_min
        in: query
        required: false
        schema:
          type: integer
        description: Number of comments on the post. (Inclusive Lower Bound)
      - name: content_form
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIDEO
          - IMAGE
        description: Content medium. Case-sensitive; values are stored and returned
          in uppercase.
      - name: creator_follower_count
        in: query
        required: false
        schema:
          type: integer
        description: Follower count of the post's creator.
      - name: creator_follower_count_max
        in: query
        required: false
        schema:
          type: integer
        description: Follower count of the post's creator. (Inclusive Upper Bound)
      - name: creator_follower_count_min
        in: query
        required: false
        schema:
          type: integer
        description: Follower count of the post's creator. (Inclusive Lower Bound)
      - name: creator_id
        in: query
        required: false
        schema:
          type: string
        description: Limit results to a single creator by id (from `/api/v1/creator/`).
      - name: creator_username
        in: query
        required: false
        schema:
          type: string
        description: Creator username substring. Case-insensitive.
      - name: earned_media_value_cents
        in: query
        required: false
        schema:
          type: integer
        description: Estimated earned media value, in cents.
      - name: earned_media_value_cents_max
        in: query
        required: false
        schema:
          type: integer
        description: Estimated earned media value, in cents. (Inclusive Upper Bound)
      - name: earned_media_value_cents_min
        in: query
        required: false
        schema:
          type: integer
        description: Estimated earned media value, in cents. (Inclusive Lower Bound)
      - name: engagement_rate
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Engagement as a fraction of views (for example, 0.05 = 5%).
      - name: engagement_rate_max
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Engagement as a fraction of views (for example, 0.05 = 5%). (Inclusive
          Upper Bound)
      - name: engagement_rate_min
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Engagement as a fraction of views (for example, 0.05 = 5%). (Inclusive
          Lower Bound)
      - name: external_id
        in: query
        required: false
        schema:
          type: string
        description: Platform-side post id. Matched exactly.
      - name: is_influencer
        in: query
        required: false
        schema:
          type: boolean
        description: Limit results to the brand's influencer content, or exclude it
          with `false`. Requires brand_id.
      - name: is_owned
        in: query
        required: false
        schema:
          type: boolean
        description: Limit results to content owned by the brand. Requires brand_id.
      - name: is_tagged
        in: query
        required: false
        schema:
          type: boolean
        description: Limit results to content where the brand is tagged. Requires
          brand_id.
      - name: language
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Language codes to include, comma-separated (for example, en,
          es).
        explode: false
        style: form
      - name: like_count
        in: query
        required: false
        schema:
          type: integer
        description: Number of likes on the post.
      - name: like_count_max
        in: query
        required: false
        schema:
          type: integer
        description: Number of likes on the post. (Inclusive Upper Bound)
      - name: like_count_min
        in: query
        required: false
        schema:
          type: integer
        description: Number of likes on the post. (Inclusive Lower Bound)
      - name: media_duration
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Length of the media in seconds.
      - name: media_duration_max
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Length of the media in seconds. (Inclusive Upper Bound)
      - name: media_duration_min
        in: query
        required: false
        schema:
          type: number
          format: float
        description: Length of the media in seconds. (Inclusive Lower Bound)
      - name: mention_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - content
            - comment
          uniqueItems: true
        description: Limit results to these mention kinds, comma-separated. Requires
          brand_id.
        explode: false
        style: form
      - name: mention_type_not
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - content
            - comment
          uniqueItems: true
        description: Exclude these mention kinds, comma-separated. Requires brand_id.
        explode: false
        style: form
      - name: net_promoter_score
        in: query
        required: false
        schema:
          type: integer
        description: Brand net promoter score for the content. Requires brand_id.
      - name: net_promoter_score_max
        in: query
        required: false
        schema:
          type: integer
        description: Brand net promoter score for the content. Requires brand_id.
          (Inclusive Upper Bound)
      - name: net_promoter_score_min
        in: query
        required: false
        schema:
          type: integer
        description: Brand net promoter score for the content. Requires brand_id.
          (Inclusive Lower Bound)
      - name: order_by
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - posted_at
            - -posted_at
            - view_count
            - -view_count

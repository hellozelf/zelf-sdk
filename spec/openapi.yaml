  /api/v1/detection/:
    post:
      operationId: detection.create
      description: |-
        `detection.create`

        Detects a list of brands in one video. Zelf Detection reads the whole video and finds each scene where a brand is identifiable: its logo or name is visible (on a product, on packaging or in on-screen text) or the brand is named out loud. Every appearance (placement) comes back with its timestamp, what was detected and how confident the detection is. Send the brands in `context.hints.brands`.

        Identify the video with `content_id` (a video already in Zelf) or `content_url` (a link to any supported video). Sending both, or neither, returns `VALIDATION_ERROR`. A `content_url` that is not in Zelf yet is added first, which makes the detection take longer.

        **Limits**

        - One video per request, up to 90 minutes. YouTube, TikTok and Instagram videos. Photo posts are not supported.
        - A product with no visible logo or name, and no spoken mention, is not detected.
        - `content_url`: the full video link, not a short link (`vm.tiktok.com`, `vt.tiktok.com`, `tiktok.com/t/`). Supported forms: `youtube.com/watch?v=<id>`, `youtu.be/<id>`, `youtube.com/shorts/<id>`, `tiktok.com/@<handle>/video/<id>`, `instagram.com/reel/<id>`, `/p/<id>`, `/tv/<id>`.
        - `context.hints.brands`: 1 to 200 brands. No two names that differ only by punctuation or digits.
        - `context.hints.brands[].name`: up to 60 characters.
        - `context.hints.brands[].identifiers`: 2 to 10, each 2 to 200 characters, including the brand name.
        - `context.hints.brands[].negatives`: optional, up to 12, each up to 200 characters.

        A request that breaks a rule returns `VALIDATION_ERROR` for the first rule it breaks. `error.details.field` names the field, for example `context.hints.brands[3].identifiers`, and `error.details.code` is one of `INVALID_REQUEST`, `NO_BRANDS`, `TOO_MANY_BRANDS`, `INVALID_BRAND`, `IDENTIFIER_COUNT`, `IDENTIFIER_TOO_SHORT`, `UNSUPPORTED_URL`, `SHORT_LINK`, `PHOTO_POST` or `VIDEO_TOO_LONG`.

        Detection is asynchronous. This method returns immediately with the detection at `status: SCHEDULED`. Poll `detection.get` until `status` is `SUCCESS` or `FAILED`; both are final.
      summary: Detect brands in a video
      tags:
      - Detection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionCreateRequest'
            examples:
              ByContentUrl:
                value:
                  content_url: https://www.youtube.com/watch?v=PpAPhxsuCJw
                  context:
                    hints:
                      brands:
                      - name: Nike
                        identifiers:
                        - Nike
                        - Jordan
                        - Air Force 1
                        negatives:
                        - Jordan (the country)
                      - name: Adidas
                        identifiers:
                        - Adidas
                        - Samba
                        negatives: []
                summary: By content url
              ByContentId:
                value:
                  content_id: con_DZaWwnKo5HThZ9bu
                  context:
                    hints:
                      brands:
                      - name: Nike
                        identifiers:
                        - Nike
                        - Jordan
                        - Air Force 1
                        negatives:
                        - Jordan (the country)
                      - name: Adidas
                        identifiers:
                        - Adidas
                        - Samba
                        negatives: []
                summary: By content id
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DetectionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DetectionCreateRequest'
        required: true
      security:
      - ApiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Detection'

  /api/v1/creator_sync/:
    post:
      operationId: creator_sync.create
      description: |-
        `creator_sync.create`

        Add a creator's profile and posts to Zelf so their videos can be analyzed. Send the creator's `profile_url`. Zelf reads and stores the profile and the creator's own posts, which then appear in `creators.list` and `content.list`.

        Syncing is asynchronous. This method returns immediately with the sync at `status: SYNCING`. Poll `creator_sync.get` until `status` is `SUCCESS` or `FAILED`.

        Only the creator's own posts are synced. Reposts and posts they are tagged in are not. Synced content is not attached to your brand, so it does not appear in brand-scoped totals.
      summary: Create Creator Sync
      tags:
      - Creator Sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorSyncCreateRequest'
            examples:
              Example:
                value:
                  profile_url: https://www.instagram.com/zelfai
          application/x-www-form-urlencoded:

                          - timestamp: 00:12-00:15
                            video_url_at_timestamp: https://www.youtube.com/watch?v=PpAPhxsuCJw&t=7s
                            modality: Visual
                            what_detected: Nike swoosh on the left shoe
                            reasoning: The swoosh is fully visible on the left shoe.

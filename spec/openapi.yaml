      description: |-
        `creators.list`

        Returns creators across the platforms Zelf supports. At least one of `id`, `username`, or `email` must be supplied to scope the search.

        Results can be ordered with `order_by` (`follower_count`, `id`). The `id` of each creator corresponds to the `creator_id` filter on `creator_vetting.list`. Requests that supply none of the required filters return `INVALID_ID`.

openapi: 3.1.0
info:
  title: ZelfAI APIs
  version: 1.0.0
  description: |-
    The ZelfAI API provides programmatic access to ZelfAI's creator and content intelligence. Use it to search the content and creators tracked for your brand, run AI analyses over that content, vet individual creators, and subscribe to webhooks that deliver results as they are produced.

    Your API key reaches your own brand and every brand linked to it, sub-brands included; these are your linked brands, `brands.list` returns exactly that set, and any `brand_id` parameter accepts any brand in it.

    The content and AI analysis endpoints also accept a `brand_id` from `brands.catalog`, the catalog of brands Zelf curates for competitive benchmarking. Those brands are readable by every key; the brand write endpoints accept only your linked brands.

    This reference is organized by resource. A resource is a type of object in ZelfAI - such as a piece of content, a creator, or an analysis - and each resource is represented as a JSON object. For each one, the reference lists its fields and the methods it supports (`LIST`, `GET`, `POST`, and so on).

    ## Glossary

    - **Brand** - the workspace an API key represents. A brand owns the content, creators, and analyses you access through the API.
    - **Workspace brand** - the brand an API key is issued for. It is the brand every endpoint acts on when `brand_id` is omitted, and the brand new sub-brands are created under.
    - **Sub-brand** - a brand nested under a parent brand, used to track a competitor (`COMPETITIVE`) or a content theme (`THEME`) separately.
    - **Content** - a single social post (a video, image, or text post) from any platform ZelfAI covers.
    - **Creator** - a social account, identified by its platform and username.
    - **Tracked / influencer account** - creator accounts a brand follows: `tracked` identifies accounts the brand monitors, and `influencer` identifies potential partnership candidates.
    - **AI analysis** - an AI run over the content selected by `content_filters` (or its comments) for a `topic`. An analysis is divided into one or more runs.
    - **Creator vetting** - an AI run that retrieves a creator's profile and scores its safety and brand fit.
    - **Run** - a single unit of work within an analysis or vetting, each with its own `id` and `status` (`IN_PROGRESS`, `COMPLETED`, `EMPTY_RESULT`, `FAILED`).

    ## Authentication

    Every request must be authenticated with an API key issued for your brand. Supply the key in the `x-api-key` request header. A request without a valid key returns `INVALID_API_KEY`.

    All responses are returned as `application/json`; the `Accept` header is not required.

    ## Response format

    Every successful response is a JSON object that uses the same envelope:

    ```json
    {
      "log_id": "<identifier for this request, useful in support tickets>",
      "timestamp": "<UTC ISO-8601>",
      "results": [ ... ],
      "item_count": <number of items on this page>,
      "page": <current page>,
      "next": <next page number, or null>,
      "previous": <previous page number, or null>
    }
    ```

    The `results` field is always an array. List methods return the matching items, and methods that address a single resource return that resource as the only element of the array, with `item_count: 1`.

    The remaining fields describe the current page. When more results are available, `next` holds the number of the following page; pass it as the `page` query parameter to retrieve it. `previous` works the same way for the preceding page. Each is `null` when there is no page in that direction.

    ## Errors

    When a request cannot be completed, the API returns the appropriate HTTP status code and a JSON body containing an `error` object:

    ```json
    {
      "log_id": "...",
      "timestamp": "...",
      "error": {
        "code": "BRAND_ID_REQUIRED",
        "message": "...",
        "details": { ... }
      }
    }
    ```

    The `error.code` field is a constant your application can test to handle each condition; `message` is a description of the problem, and `details` provides condition-specific context. The following codes are returned:

    | Code | HTTP | Meaning |
    | --- | --- | --- |
    | `INVALID_API_KEY` | 401 | The `x-api-key` header is missing, malformed, or doesn't match a known key. |
    | `EXPIRED_API_KEY` | 401 | The key was valid but its expiration date has passed. Issue a new key. |
    | `REVOKED_API_KEY` | 401 | The key was explicitly revoked. Issue a new key. |
    | `INVALID_ID` | 400 | A path or query id (`brand_id`, `creator_id`, content id) is not a valid identifier. |
    | `NOT_FOUND` | 404 | The resource does not exist or is outside this api key's scope. |
    | `VALIDATION_ERROR` | 400 | A query parameter has the wrong type, an unknown sort field, or otherwise failed validation. `details` lists the offending fields. |
    | `BRAND_ID_REQUIRED` | 400 | A brand-scoped filter or sort was used without supplying `brand_id`. `details.blocked_by` names the parameters that triggered it. |
    | `PERMISSION_DENIED` | 403 | The api key cannot access the requested brand or resource. |
    | `RATE_LIMIT_EXCEEDED` | 429 | A quota limit was exceeded. `details.scopes` names the group(s) that were hit and `details.retry_after_seconds` is how long to wait before retrying. |
    | `NOT_ACCEPTABLE` | 406 | The requested response media type cannot be served (the API only emits `application/json`). |
    | `SERVICE_UNAVAILABLE` | 503 | The request took too long and was stopped. Narrow the date window or pass `brand_id`, then retry. |
    | `INTERNAL_ERROR` | 500 | Something went wrong on our side. Include `log_id` when filing a support ticket. |

    ## Sorting

    List methods that support sorting accept an `order_by` parameter. A field name on its own sorts results in descending order (largest or most recent first); prefixing it with a hyphen (`-`) sorts in ascending order. For example, `order_by=view_count` returns the most-viewed items first, and `order_by=-view_count` returns the least-viewed first. To sort by several fields, supply a comma-separated list, such as `order_by=view_count,-posted_at`. Each method documents the fields it accepts; an unsupported field returns `VALIDATION_ERROR`.

    ## Rate limits

    Requests are subject to quotas applied per API key and per brand, grouped as shown below. When a quota is exceeded, the API returns `RATE_LIMIT_EXCEEDED`; the response's `details.retry_after_seconds` indicates how long to wait before retrying, and `details.scopes` identifies the quota groups that were exceeded. The exact limit for each group is available in the dashboard.

    | Group | Scope (`details.scopes`) |
    | --- | --- |
    | General | `global` |
    | AI Analysis | `ai_analysis` |
    | Creator Vetting | `creator_vetting` |
    | Data Records | `data_records` |
    | General | `mcp` |
    | AI Analysis | `mcp.ai_analysis` |
    | Creator Vetting | `mcp.creator_vetting` |
    | Data Records | `mcp.data_records` |

    ## Webhooks

    Webhooks let your application receive data as it becomes available, without polling. Once you register an endpoint, ZelfAI sends an HTTP POST request to it for each subscribed event. Two categories are supported:

    - **Snapshots** (`content.snapshot`, `creator.snapshot`) are delivered on a schedule and carry a signed, time-limited link to an NDJSON file containing the matching content or creators.
    - **Events** (`creator_vetting.completed`, `ai_analysis.completed`) are delivered when a run reaches a terminal state and carry a lightweight notification; retrieve the full result from the corresponding results operation (`ai_analysis.results` or `creator_vetting.results`).

    Every delivery shares a common envelope (`id`, `type`, `subscription_id`, `delivered_at`, `livemode`, `resource`, `delivery_mode`, `data`). Respond with any `2xx` status code to acknowledge receipt; a non-2xx response or a timeout is retried with exponential backoff. The **Webhooks** section documents each payload and the structure of the NDJSON files.

    ## Models

    The **Models** section describes the JSON representations the API returns and delivers through webhooks. Every list method wraps its items in the response envelope described above.
paths:
  /api/v1/ai_analysis/:
    post:
      operationId: ai_analysis.create
      description: |-
        `ai_analysis.create`

        Starts an AI analysis over the content matched by `content_filters` (or its comments) for a given `topic`. Runs complete asynchronously; this method returns immediately with the created analysis and its initial runs.

        The analysis runs over the highest-ranked matching content by `content_filters.order_by`, up to 500 posts or the limit configured for your workspace. When `order_by` is omitted, content is ranked by `earned_media_value_cents` descending.

        The created analysis is returned as the single item in `results`. Take its `id` and poll `ai_analysis.list` until a run reports `COMPLETED`. An analysis can take an hour or more, so poll at a moderate interval; prefer the `ai_analysis.completed` webhook over frequent polling, which can trigger `RATE_LIMIT_EXCEEDED`. Once complete, retrieve the payload from `ai_analysis.results`, passing `analysis_id=<id>`.
      summary: Create AI Analysis
      tags:
      - AI Analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalysisCreateRequest'
            examples:
              Example:
                value:
                  name: ZelfAI
                  topic: ZelfAI
                  analysis_scope:
                  - CONTENT
                  content_filters:
                    view_count_min: 42
                    view_count_max: 42
                    comment_count_min: 42
                    comment_count_max: 42
                    like_count_min: 42
                    like_count_max: 42
                    share_count_min: 42
                    share_count_max: 42
                    total_engagement_min: 42
                    total_engagement_max: 42
                    earned_media_value_cents_min: 42
                    earned_media_value_cents_max: 42
                    media_duration_min: 4.2
                    media_duration_max: 4.2
                    posted_after: '2025-01-01T00:00:00Z'
                    posted_before: '2025-01-01T00:00:00Z'
                    platform:
                    - instagram
                    language:
                    - en
                    content_form: VIDEO
                    search: zelfai
                    creator_id: cr_pfqPv0FLsBRimHfi
                    brand_id: brd_Lw6ZZmNYhW0P9k0x
                    is_owned: true
                    is_tagged: true
                    is_influencer: true
                    external_id: '7376543210987654321'
                    creator_username: zelfai
                    mention_type:
                    - content
                    mention_type_not:
                    - comment
                    creator_follower_count_min: 42
                    creator_follower_count_max: 42
                    engagement_rate_min: 4.2
                    engagement_rate_max: 4.2
                    net_promoter_score_min: 42
                    net_promoter_score_max: 42
                    posted_within_days: 42
                    posted_within_hours: 42
                    order_by:
                    - view_count
                    - -posted_at
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiAnalysisCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiAnalysisCreateRequest'
        required: true
      security:
      - ApiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiAnalysis'
                  item_count:
                    type: integer
                  page:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                  previous:
                    type:
                    - integer
                    - 'null'
                required:
                - log_id
                - timestamp
                - results
                - item_count
                - page
                - next
                - previous
              examples:
                Example:
                  value:
                    log_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2026-01-01T00:00:00Z'
                    results:
                    - id: bod_huNssMQX4FTvALEY
                      analysis_type: AI_ANALYSIS
                      name: ZelfAI
                      topic: ZelfAI
                      created_at: '2026-05-12T14:30:00Z'
                      modified_at: '2026-05-12T15:00:00Z'
                      analyses:
                      - id: ban_xJZFbcWNkF9M3brf
                        scope: CONTENT
                        status: COMPLETED
                    item_count: 1
                    page: 1
                    next: null
                    previous: null
          description: ''
        '400':
          description: Validation failed or a supplied id is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The `x-api-key` header is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The api key cannot access the requested brand or resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource does not exist or is outside this key's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '406':
          description: The requested response media type cannot be served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error406'
        '429':
          description: A rate-limit quota was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Something went wrong on our side; include `log_id` when reporting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '503':
          description: The request took too long and was stopped; narrow the window
            or pass `brand_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
    get:
      operationId: ai_analysis.list
      description: |-
        `ai_analysis.list`

        Returns the AI analyses that have been created, ordered newest first, each with its runs and their current `status`. It lists the analyses available and tracks run progress without retrieving the full result payload.

        An analysis `id` maps to `analysis_id` on `ai_analysis.results` and `ai_analysis.contents`, and each run's `id` maps to `id` on `ai_analysis.results`. The run `result` download is not included in this response; retrieve it from `ai_analysis.results` once a run reports `COMPLETED` (statuses: `IN_PROGRESS`, `COMPLETED`, `EMPTY_RESULT`, `FAILED`). Supply `id` to return a single analysis.
      summary: List AI Analyses
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: Optional analysis id. When supplied, only that analysis is returned.
          Returns `INVALID_ID` if malformed.
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: Items per page (1-30). Defaults to 30; larger values are clamped
          down.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      tags:
      - AI Analysis
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    $ref: '#/components/schemas/PaginatedAiAnalysisList'
                  item_count:
                    type: integer
                  page:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                  previous:
                    type:
                    - integer
                    - 'null'
                required:
                - log_id
                - timestamp
                - results
                - item_count
                - page
                - next
                - previous
              examples:
                Example:
                  value:
                    log_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2026-01-01T00:00:00Z'
                    results:
                    - id: bod_huNssMQX4FTvALEY
                      analysis_type: AI_ANALYSIS
                      name: ZelfAI
                      topic: ZelfAI
                      created_at: '2026-05-12T14:30:00Z'
                      modified_at: '2026-05-12T15:00:00Z'
                      analyses:
                      - id: ban_xJZFbcWNkF9M3brf
                        scope: CONTENT
                        status: COMPLETED
                    item_count: 1
                    page: 1
                    next: null
                    previous: null
          description: ''
        '400':
          description: Validation failed or a supplied id is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The `x-api-key` header is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The api key cannot access the requested brand or resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource does not exist or is outside this key's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '406':
          description: The requested response media type cannot be served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error406'
        '429':
          description: A rate-limit quota was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Something went wrong on our side; include `log_id` when reporting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '503':
          description: The request took too long and was stopped; narrow the window
            or pass `brand_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
  /api/v1/ai_analysis/results/:
    get:
      operationId: ai_analysis.results
      description: |-
        `ai_analysis.results`

        Returns each run's `result`, a signed, time-limited download of the analysis payload. Call this method after a run reaches `COMPLETED`; for earlier statuses the row is returned with a `null` `result`.

        Supply `analysis_id` (the analysis `id` from `ai_analysis.list`) to return every run of that analysis, or `id` (a single run's `id`) to return one run. Exactly one is required. A malformed id returns `INVALID_ID`; omitting both returns `VALIDATION_ERROR`.
      summary: Get AI Analysis Results
      parameters:
      - in: query
        name: analysis_id
        schema:
          type: string
        description: Analysis id (from `ai_analysis.list`). Returns every run of that
          analysis. Exactly one of `analysis_id` and `id` is required, and a request
          carrying both is rejected. Returns `INVALID_ID` if malformed.
      - in: query
        name: id
        schema:
          type: string
        description: Single run id. Returns only that run. Exactly one of `analysis_id`
          and `id` is required, and a request carrying both is rejected. Returns `INVALID_ID`
          if malformed.
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: Items per page (1-30). Defaults to 30; larger values are clamped
          down.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      tags:
      - AI Analysis
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    $ref: '#/components/schemas/PaginatedAiAnalysisResultList'
                  item_count:
                    type: integer
                  page:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                  previous:
                    type:
                    - integer
                    - 'null'
                required:
                - log_id
                - timestamp
                - results
                - item_count
                - page
                - next
                - previous
              examples:
                Example:
                  value:
                    log_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2026-01-01T00:00:00Z'
                    results:
                    - id: ban_xJZFbcWNkF9M3brf
                      analysis_id: bod_huNssMQX4FTvALEY
                      scope: CONTENT
                      status: COMPLETED
                      result:
                        download_url: https://storage.googleapis.com/zelf-webhook-snapshots/ai_analysis/run_8f2c.json?X-Goog-Signature=...
                        expires_at: 1718000000
                        format: json
                      created_at: '2026-05-12T14:30:00Z'
                      modified_at: '2026-05-12T15:00:00Z'
                    item_count: 1
                    page: 1
                    next: null
                    previous: null
          description: ''
        '400':
          description: Validation failed or a supplied id is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The `x-api-key` header is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The api key cannot access the requested brand or resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource does not exist or is outside this key's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '406':
          description: The requested response media type cannot be served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error406'
        '429':
          description: A rate-limit quota was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Something went wrong on our side; include `log_id` when reporting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '503':
          description: The request took too long and was stopped; narrow the window
            or pass `brand_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
  /api/v1/ai_analysis/contents/:
    get:
      operationId: ai_analysis.contents
      description: |-
        `ai_analysis.contents`

        Returns the content an AI analysis ran over, in the standard content shape. Use it to inspect the exact posts included in an analysis.

        Requires `analysis_id` (an analysis `id` from `ai_analysis.list`). Brand-scoped fields (`is_owned`, `is_tagged`, `net_promoter_score`, ...) are `null` in this response.
      summary: List AI Analysis Content
      parameters:
      - in: query
        name: analysis_id
        schema:
          type: string
        description: Analysis id, as returned by `ai_analysis.list`.
        required: true
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: Items per page (1-30). Defaults to 30; larger values are clamped
          down.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      tags:
      - AI Analysis
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    $ref: '#/components/schemas/PaginatedContentList'
                  item_count:
                    type: integer
                  page:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                  previous:
                    type:
                    - integer
                    - 'null'
                required:

  /api/v1/webhooks/deliveries/:
    get:
      operationId: webhook.deliveries
      description: |-
        `webhook.deliveries`

        Lists webhook delivery attempts for the brand, newest first. Filter by `subscription` (masked id), `state`, and a `created_after` / `created_before` window.
      summary: List Webhook Deliveries
      parameters:
      - name: created
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Delivery creation time (ISO 8601).
      - name: created_after
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Delivery creation time (ISO 8601). (Inclusive Lower Bound)
      - name: created_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Delivery creation time (ISO 8601). (Inclusive Upper Bound)
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: Items per page (1-30). Defaults to 30; larger values are clamped
          down.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      - name: sort_by
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - created
            - -created
          uniqueItems: true
        explode: false
        style: form
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - EXHAUSTED
          - QUOTA_EXHAUSTED
        description: Current delivery state.
      - name: state!
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - EXHAUSTED
          - QUOTA_EXHAUSTED
        description: exclude where state - Current delivery state.
      - in: query
        name: subscription
        schema:
          type: string
        description: Scope to a single subscription by its masked id.
      tags:
      - Webhook Management
      security:
      - ApiKey: []

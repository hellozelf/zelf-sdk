components:
  schemas:
    AccountTypeEnum:
      enum:
      - tracked
      - influencer
      - owned
      type: string
      x-internal: true
    AiAnalysis:
      type: object
      description: Response body for the AI analysis root.
      properties:
        id:
          type: string
          readOnly: true
          description: ID of the analysis. Use this value on follow-up calls.
        analysis_type:
          type: string
          readOnly: true
          description: Always `AI_ANALYSIS` here.
        name:
          type: string
          description: The analysis label.
        topic:
          type:
          - string
          - 'null'
          description: The subject the analysis focuses on.
        created_at:
          type: string
          format: date-time
          description: When the analysis was created (UTC, ISO-8601).
        modified_at:
          type: string
          format: date-time
          description: When the analysis was last modified (UTC, ISO-8601).
        analyses:
          type: array
          items:
            $ref: '#/components/schemas/AiAnalysisRun'
          description: The runs that make up this analysis, one per scope, ordered
            newest first.
      required:
      - analyses
      - analysis_type
      - created_at
      - id
      - modified_at
      - name
      - topic
    AiAnalysisCreateRequest:
      type: object
      description: Request body for ``POST /api/v1/ai_analysis/``.
      properties:
        name:
          type: string
          minLength: 1
          description: A label for this analysis.
        topic:
          type: string
          minLength: 1

servers:
- url: https://api.hellozelf.com
tags:
- name: AI Analysis
  description: Run AI analyses over content and comments. Start an analysis with a
    topic and a content filter, poll its runs for status, then fetch each run's result
    payload from `ai_analysis.results`.
- name: Brands
  description: The brands (workspaces) an API key can access. Most content endpoints
    accept a `brand_id` from here to unlock brand-specific signals like ownership,
    tagging, and NPS. `brands.catalog` adds the brands Zelf curates for competitive
    benchmarking, which every key can read content for.
- name: Content
  description: Search, list, and aggregate content (posts, videos, images) across
    the platforms ZelfAI tracks. Supports rich filtering by metrics, platform, language,
    date window, and creator, plus optional brand context.
- name: Comment
  description: Search, list comments of a content including like count, author information
    and replies.
- name: Creator
  description: Look up creators and their public profile metrics, and run creator
    vetting analyses (safety + brand-fit) through the AI pipeline.
- name: Creator Sync
  description: 'Add a creator''s profile and posts to Zelf so their videos can be
    searched and analyzed. Syncing is asynchronous: create a sync, poll it until it
    finishes, then list the creator''s videos with `content.list`.'
- name: Detection
  description: 'Find brands in social videos. Send a video and a list of brands. Zelf
    reads the whole video and finds each scene where a brand is identifiable: its
    logo or name is visible, or the brand is named out loud. Every appearance comes
    back with its timestamp and what was detected. Detection is asynchronous: create
    a detection, then poll it for the results.'
- name: Usage
  description: What your brand has spent against its limits, per group and per window,
    for both direct requests and AI clients. Reading it consumes nothing.
- name: Webhook Management
  description: Manage webhook subscriptions, signing secrets, test sends, and the
    delivery log for your brand. Create a subscription to start receiving snapshot
    or event pushes; the outbound payload shapes are documented under Webhook snapshots
    and Webhook events.
- name: Webhook snapshots
  description: Scheduled per-resource snapshot pushes. ZelfAI POSTs a manifest with
    a signed NDJSON download of the matching content or creator set.
- name: Webhook events
  description: Event-driven pushes. ZelfAI POSTs the payload inline when a tracked
    event (such as a completed creator vetting) occurs.
webhooks:
  ContentSnapshot:
    post:
      description: |
        Scheduled snapshot of the content set that a subscription matches.

        The subscription's `resource_filters` use the same query params as `content.list`, including ordering: rows are ordered by `posted_at` descending by default (override with an `order_by` in `resource_filters`). The snapshot is capped at the subscription's `max_items` (or the maximum when it is unset or `0`); a **test dispatch** always sends a small 10-row sample regardless of `max_items`.

        Delivered in `manifest` mode: `data.files` holds one signed, time-limited NDJSON download, and `data.statistics` carries the aggregate totals over the snapshot. `resource` is `content`.

        **Payload ZelfAI POSTs to the registered endpoint:**
        ```json
        {
          "id": "whd_8f2c1d4e9a",
          "type": "content.snapshot",
          "subscription_id": "whs_5Kq9Wd2pBxLm",
          "delivered_at": 1718000000,
          "livemode": true,
          "resource": "content",
          "resource_filters": {},
          "delivery_mode": "manifest",
          "data": {
            "item_count": 1,
            "statistics": {
              "post_count": 1280,
              "total_views": 4500000,
              "total_likes": 320000,
              "total_comments": 18000,
              "total_shares": 9500,
              "total_engagement": 14187,
              "total_earned_media_value_cents": 12500000,
              "total_media_duration": 53400.0,
              "engagement_rate": 0.077,
              "unique_creator_count": 412
            },
            "files": [
              {
                "format": "ndjson",
                "expires_at": 1718000000,
                "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08",
                "size_bytes": 184320,
                "item_count": 1280,
                "download_url": "https://storage.googleapis.com/zelf-webhook-snapshots/webhooks/whd_8f2c1d4e.ndjson?X-Goog-Signature=..."
              }
            ]
          }
        }
        ```

        **Inside the NDJSON file** (retrieved from `data.files[0].download_url`), there is one JSON object per line. The file packs each row onto a single line; one row is shown expanded here for readability, matching the `content.list` response shape:
        ```json
        {
          "id": "con_DZaWwnKo5HThZ9bu",
          "platform_post_id": "7376543210987654321",
          "platform": "instagram",
          "content_form": "VIDEO",
          "thumbnail_url": "https://cdn.hellozelf.com/thumbnails/zelfai-launch.png",
          "posted_at": "2026-05-12T16:00:00Z",
          "view_count": 184230,
          "like_count": 12840,
          "comment_count": 932,
          "share_count": 415,
          "total_engagement": 14187,
          "language": "en",
          "media_duration": 42.0,
          "engagement_rate": 0.077,
          "earned_media_value_cents": 248000,
          "creator": {
            "id": "cr_pfqPv0FLsBRimHfi",
            "username": "zelfai",
            "name": "ZelfAI",
            "platform": "instagram",
            "platform_handle": "zelfai",
            "platform_url": "https://www.instagram.com/zelfai",
            "profile_picture_url": "https://cdn.hellozelf.com/avatars/zelfai.png",
            "profile_bio": "Creator and content intelligence for modern brands.",
            "follower_count": 53120,
            "active_content_count": 217
          },
          "brand_id": "brd_Lw6ZZmNYhW0P9k0x",
          "net_promoter_score": 1,
          "is_owned": true,
          "is_tagged": true,
          "is_influencer": true,
          "mention_type": "content",
          "caption": "Behind the scenes at ZelfAI.",
          "description": "How ZelfAI turns social signals into creator insights.",
          "transcript": "We walk through how ZelfAI ranks creators by brand fit.",
          "platform_url": "https://www.instagram.com/zelfai",
          "ai_summary": "A product walkthrough of ZelfAI creator analytics.",
          "last_keyword": "zelf creators",
          "hashtags": [
            "zelfai",
            "creatoreconomy"
          ]
        }
        ```
      summary: content.snapshot
      tags:
      - webhook snapshots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPush'
            examples:
              Content.snapshot:
                value:
                  id: whd_8f2c1d4e9a
                  type: content.snapshot
                  subscription_id: whs_5Kq9Wd2pBxLm
                  delivered_at: 1718000000
                  livemode: true
                  resource: content
                  resource_filters: {}
                  delivery_mode: manifest
                  data:
                    item_count: 1
                    statistics:
                      post_count: 1280
                      total_views: 4500000
                      total_likes: 320000
                      total_comments: 18000
                      total_shares: 9500
                      total_engagement: 14187
                      total_earned_media_value_cents: 12500000
                      total_media_duration: 53400.0
                      engagement_rate: 0.077
                      unique_creator_count: 412
                    files:
                    - format: ndjson
                      expires_at: 1718000000
                      sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                      size_bytes: 184320
                      item_count: 1280
                      download_url: https://storage.googleapis.com/zelf-webhook-snapshots/webhooks/whd_8f2c1d4e.ndjson?X-Goog-Signature=...
                summary: content.snapshot
        required: true
      responses:
        '200':
          description: Return a `2xx` status within the endpoint's timeout to acknowledge
            receipt. Any non-2xx status, or a timeout, is treated as a failed delivery
            and retried with backoff.

  /api/v1/detection/{id}/:
    get:
      operationId: detection.get
      description: |-
        `detection.get`

        Retrieve one detection by `id`, the value returned by `detection.create`. Poll it until `status` is `SUCCESS` or `FAILED`; both are final. `result` is `null` until then. On `FAILED`, `result` carries the counts and `brands: []`.

        **Reading `result`**

        - `brands`: one entry per requested brand, in request order. `found: false` means the brand was searched for and does not appear in the video.
        - `timestamp`: `mm:ss-mm:ss`, or `mm:ss` for a single moment. Past an hour the minutes keep counting (`69:23-69:25`).
        - `modality`: `Visual` (logo or product on screen), `Text` (brand name written on screen) or `Audio` (brand name spoken).
        - `confidence`: `confirmed` means the placement passed a final check against the video's frames; `review` means it was detected but did not pass that final frame check. `Audio` placements are always `review`, because a spoken mention has no frames to check. On `Visual` and `Text` placements, `review` means the final frame check did not confirm the placement.
        - `video_url_at_timestamp`: YouTube only, opens the video 5 seconds before the placement. `null` on TikTok and Instagram.
      summary: Retrieve a detection and its placements
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Detection
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    type: array

  /api/v1/creator/vetting/results/:
    get:
      operationId: creator_vetting.results
      description: |-
        `creator_vetting.results`

        Returns the `result` for each run: a signed, time-limited download of the vetting analysis payload. Call this method after a run reaches `COMPLETED`; for earlier statuses the row is returned with a `null` `result`.

        Supply `vetting_id` (the vetting `id` from `creator_vetting.list`) to return every run of that vetting, or `id` (a single run's `id`) to return one run. One of the two is required. A malformed identifier returns `INVALID_ID`; omitting both returns `VALIDATION_ERROR`.

        **Disclosures.** When the vetting requested `DISCLOSURE`, the payload's `insight_json.disclosures` holds one entry per analyzed video: its `content_id` and a `result`. The `result` lists `evidence` items, each with the `source` it was found in (`frame` for on-screen text, `audio` for the speech transcription, `title`, `caption` or `metadata`), a `kind` (`sponsorship`, `affiliate`, `gifted` or `relationship` for a commercial relationship; `terms` or `risk` for offer conditions and warnings), the quoted `text` and, where known, `time_seconds`. It also gives each source a `channels` status: `present`, `absent` or `unknown` (not checked). Disclosures are not counted as violations.

        Limits: only videos up to 10 minutes are checked; on-screen text is read from sampled frames, so text shown only briefly can be missed; videos ZelfAI analyzed before the request are not re-analyzed for disclosures. An empty `evidence` list does not confirm that a video has no disclosure. Detection reports what was stated; it does not assess legal compliance.
      summary: Get Creator Vetting Results
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: Identifier of a single analysis. Returns only that analysis.
          Required unless `vetting_id` is supplied. Returns `INVALID_ID` if malformed.
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        required: false
        in: query
        description: Items per page (1-30). Defaults to 30; larger values are clamped
          down.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      - in: query
        name: vetting_id
        schema:
          type: string
        description: Identifier of the vetting, obtained from `creator_vetting.list`.
          Returns every analysis of that vetting. Required unless `id` is supplied.
          Returns `INVALID_ID` if malformed.
      tags:
      - Creator
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  results:
                    $ref: '#/components/schemas/PaginatedCreatorVettingResultList'
                  item_count:
                    type: integer
                  page:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                  previous:
                    type:
                    - integer
                    - 'null'
                required:
                - log_id
                - timestamp
                - results
                - item_count
                - page
                - next
                - previous
              examples:

      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
        description: Creator email (exact match, case-insensitive).
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Creator id (from a previous creator response).
      - name: order_by
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - follower_count
            - -follower_count
            - id
            - -id
          uniqueItems: true
        explode: false
        style: form
        description: '**Sort direction is inverted:** `order_by=field` sorts descending
          and `order_by=-field` sorts ascending. Comma-separate to sort by multiple
          fields.'
      - name: page
        required: false
        in: query
        description: Page number (1-based). Omit for the first page.
        schema:
          type: integer
          minimum: 1
          default: 1

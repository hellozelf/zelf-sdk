  AiAnalysisCompleted:
    post:
      description: |
        Fires when an AI analysis run reaches a terminal state (`COMPLETED` or `FAILED`).

        Delivered in `inline` mode as a lightweight notification: `data.items[0]` carries the analysis id, its `analysis_type`, `modified_at`, and each run's `id` and `status`, rather than the full payload. Retrieve the `result` from `ai_analysis.results` (pass `analysis_id=<id>`). `resource` is `null`. An analysis with multiple scopes fires once per run, as each reaches a terminal state.

        **Payload ZelfAI POSTs to the registered endpoint:**
        ```json
        {
          "id": "whd_8f2c1d4e9a",
          "type": "ai_analysis.completed",
          "subscription_id": "whs_5Kq9Wd2pBxLm",
          "delivered_at": 1718000000,
          "livemode": true,
          "resource": null,
          "resource_filters": {},
          "delivery_mode": "inline",
          "data": {
            "item_count": 1,
            "items": [
              {
                "id": "bod_huNssMQX4FTvALEY",
                "analysis_type": "AI_ANALYSIS",
                "modified_at": "2026-06-21T12:00:00Z",
                "analyses": [
                  {
                    "id": "ban_xJZFbcWNkF9M3brf",
                    "status": "COMPLETED"
                  },
                  {
                    "id": "ban_Nc7m1Pe6Qd4Kf0Az",
                    "status": "IN_PROGRESS"
                  }
                ]
              }
            ]
          }
        }
        ```
      summary: ai_analysis.completed
      tags:
      - webhook events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPush'
            examples:
              AiAnalysis.completed:
                value:
                  id: whd_8f2c1d4e9a
                  type: ai_analysis.completed
                  subscription_id: whs_5Kq9Wd2pBxLm
                  delivered_at: 1718000000
                  livemode: true
                  resource: null
                  resource_filters: {}
                  delivery_mode: inline
                  data:
                    item_count: 1
                    items:
                    - id: bod_huNssMQX4FTvALEY
                      analysis_type: AI_ANALYSIS
                      modified_at: '2026-06-21T12:00:00Z'
                      analyses:
                      - id: ban_xJZFbcWNkF9M3brf
                        status: COMPLETED
                      - id: ban_Nc7m1Pe6Qd4Kf0Az
                        status: IN_PROGRESS
                summary: ai_analysis.completed
        required: true
      responses:
        '200':
          description: Return a `2xx` status within the endpoint's timeout to acknowledge
            receipt. Any non-2xx status, or a timeout, is treated as a failed delivery
            and retried with backoff.

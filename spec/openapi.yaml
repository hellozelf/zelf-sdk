    PatchedBrandUpdateRequest:
      type: object
      description: |-
        Partial update for a brand's monitoring keywords.

        Every field is optional, and only the supplied fields are changed, but at
        least one field is required.
      properties:
        search_terms:
          type: array
          items:
            type: string
            minLength: 1
          description: Plain keywords the brand monitors across platforms, matched
            as-is (case-insensitive, no operators).
        inclusion_terms:
          type: array
          items:
            type: string
            minLength: 1
          description: Terms that must be present for content to match.
        exclusion_terms:
          type: array
          items:
            type: string
            minLength: 1
          description: Terms that disqualify content from matching.
        compound_inclusion_terms:
          type: array
          items:
            type: string
            minLength: 1
          description: Secondary inclusion terms layered on top of `inclusion_terms`.
        influencer_terms:
          type: array
          items:
            type: string
            minLength: 1
          description: Terms that mark matched content as influencer content.
        allowed_languages:
          type: array
          items:
            type: string
            minLength: 1
          description: ISO 639-1 codes to track, or the single value `all`. An empty
            array means all languages are tracked. A code outside ISO 639-1 is rejected,
            because a brand tracking it would match no content.
        boolean_query:
          type:
          - string
          - 'null'
          description: |-
            Full-text search across the caption, transcript, summary, and hashtags.

            **Syntax**
            - Multiple words are combined with AND: `nike running` matches content containing both `nike` and `running`.
            - `OR` (case-insensitive) matches either side: `nike OR adidas`.
            - `NOT` (case-insensitive) excludes a term: `running NOT marathon` matches `running` but not `marathon`.
            - Wrap a phrase in double quotes to match the words in order: `"summer collection"`.
            - Negate a phrase with `NOT`: `NOT "out of stock"`.
            - Group with parentheses to combine operators: `(nike OR adidas) running`.
            - `ONEAR/n` (case-insensitive) matches terms within `n` words of each other, in order: `apple ONEAR/2 watch` matches `apple watch` and `apple smart watch`, but not `watch ... apple`. It binds more tightly than `AND` and `OR`, so `apple ONEAR/2 watch AND cheap` is interpreted as `(apple near watch) AND cheap`.

            **Examples**
            - `nike running` - contains both terms.
            - `nike OR adidas` - contains either brand.
            - `"summer sale" NOT clearance` - the exact phrase, without `clearance`.
            - `(running OR cycling) NOT "beginner guide"` - either sport, excluding the phrase.
            - `apple ONEAR/2 watch` - `apple` within two words before `watch`.

            Content matching this query is connected to (associated with) this brand.
        brand_id:
          type: string
          minLength: 1
          description: Brand to update, specified as an `id` from `brands.list`. Omit
            to update the workspace brand.
      x-internal: true
    PatchedWebhookSubscriptionUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: Destination URL where webhook payloads are sent.

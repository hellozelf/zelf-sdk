name: Publish Rust

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: rust

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'rust/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Publish unless crates.io already has this version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if curl -sf -H 'User-Agent: zelf-sdk-release' \
               "https://crates.io/api/v1/crates/zelf-sdk/${version}" >/dev/null; then
            echo "::notice::zelf-sdk ${version} is already on crates.io, nothing to publish"
            exit 0
          fi
          cargo publish --token "$CARGO_TOKEN"
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

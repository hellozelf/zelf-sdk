name: Spec sync

on:
  push:
    branches: ['spec/**']
    paths:
      - 'spec/openapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: regenerate from the spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # Not GITHUB_TOKEN: a push made with it is attributed to
          # github-actions[bot], which this repo's fork pull request approval
          # policy counts as a first-time contributor, so every run the push
          # triggers is held for manual approval.
          token: ${{ secrets.SDK_SYNC_TOKEN }}

      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: classify
        run: uv run --with pyyaml python codegen/pipeline.py classify

      - name: The spec obeys the version rules
        run: uv run --with pyyaml python codegen/pipeline.py check-spec

      - working-directory: js
        run: npm ci

      - run: make all

      - name: Every client sits on the spec version
        run: uv run --with pyyaml python codegen/pipeline.py check-manifests

      - name: Write the changelog and refresh the lock
        if: steps.classify.outputs.kind != 'docs-only'
        run: uv run --with pyyaml python codegen/pipeline.py changelog

      - name: Commit the regenerated tree
        env:
          KIND: ${{ steps.classify.outputs.kind }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$KIND" in
            structural|version-only|docs-only) ;;
            *) echo "::error::unexpected classification: $KIND"; exit 1 ;;
          esac
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "::notice::the spec and the clients already agree"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate clients for ${KIND} spec change"
          # This commit leaves spec/openapi.yaml alone, so the path filter above
          # keeps the push from starting this workflow again.
          git push origin "HEAD:${BRANCH}"

      - name: Open the pull request
        env:
          # Not GITHUB_TOKEN: GitHub starts no workflow runs for events it
          # raises itself, so a pull request opened with it would sit with no
          # checks against it.
          GH_TOKEN: ${{ secrets.SDK_SYNC_TOKEN }}
          KIND: ${{ steps.classify.outputs.kind }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^  version:' spec/openapi.yaml | awk '{print $2}')

          # Created on first use, so the repo needs no setup and a missing label
          # cannot fail the run after the work is already done.
          gh label create "spec:${KIND}" --color ededed --force >/dev/null

          open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_prs" != "0" ]; then
            gh pr edit "$BRANCH" --add-label "spec:${KIND}"
            echo "::notice::updated the open pull request for $BRANCH"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --label "spec:${KIND}" \
            --title "feat: update the OpenAPI document to v${version}" \
            --body "$(printf '%s\n' \
              "The OpenAPI document moved to \`${version}\`." \
              "" \
              "The clients, their versions and the changelog were regenerated before this pull request opened, so one diff carries the document and everything that follows from it." \
              "" \
              "Merging publishes every released client at this version.")"

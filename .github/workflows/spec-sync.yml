name: Spec sync

on:
  push:
    branches: ['spec/**']
    paths:
      - 'spec/openapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: regenerate from the spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.SDK_SYNC_TOKEN }}

      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: classify
        run: uv run --with pyyaml python codegen/pipeline.py classify

      # The clients carry their own version, so a corrected description ships
      # as a patch and only a moved surface costs a minor. The bump lands
      # before generation because every manifest is written from it.
      - id: bump
        env:
          KIND: ${{ steps.classify.outputs.kind }}
        run: |
          position=patch
          [ "$KIND" = "structural" ] && position=minor
          uv run --with pyyaml python codegen/pipeline.py bump "$position"
          echo "version=$(cat spec/sdk-version.txt)" >> "$GITHUB_OUTPUT"

      - name: The bump is at least as large as the change
        run: uv run --with pyyaml python codegen/pipeline.py check-spec

      - working-directory: js
        run: npm ci

      - run: make all

      - name: Every client ships the one SDK version
        run: uv run --with pyyaml python codegen/pipeline.py check-manifests

      - name: Write the changelog and refresh the lock
        run: uv run --with pyyaml python codegen/pipeline.py changelog

      - name: Commit the regenerated tree
        env:
          KIND: ${{ steps.classify.outputs.kind }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$KIND" in
            structural|version-only|docs-only) ;;
            *) echo "::error::unexpected classification: $KIND"; exit 1 ;;
          esac
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "::notice::the spec and the clients already agree"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate clients for ${KIND} spec change"
          git push origin "HEAD:${BRANCH}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_TOKEN }}
          KIND: ${{ steps.classify.outputs.kind }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(cat spec/sdk-version.txt)
          spec=$(grep -m1 '^  version:' spec/openapi.yaml | awk '{print $2}')

          gh label create "spec:${KIND}" --color ededed --force >/dev/null

          open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_prs" != "0" ]; then
            gh pr edit "$BRANCH" --add-label "spec:${KIND}"
            echo "::notice::updated the open pull request for $BRANCH"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --label "spec:${KIND}" \
            --title "feat: release the clients at v${version}" \
            --body "$(printf '%s\n' \
              "The clients move to \`${version}\`, built from OpenAPI \`${spec}\`." \
              "" \
              "This is a \`${KIND}\` change: \`structural\` means the API surface moved and costs a minor, anything else is a patch over the same surface." \
              "" \
              "The clients, their versions and the changelog were regenerated before this pull request opened, so one diff carries everything that follows from the document." \
              "" \
              "Merging publishes every released client at this version.")"

name: Ruby

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - name: Test with coverage
        working-directory: ruby
        run: bundle exec ruby -Itest test/all.rb

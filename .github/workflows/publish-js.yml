name: Publish JS

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: js

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'js/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish unless npm already has this version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "zelf-sdk@$version" version >/dev/null 2>&1; then
            echo "::notice::zelf-sdk@$version is already on npm, nothing to publish"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
